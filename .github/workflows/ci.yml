name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ci, tsan, release]
    steps:
      - uses: actions/checkout@v5

      - name: Configurar
        run: cmake --preset ${{ matrix.preset }}

      - name: Compilar
        run: cmake --build --preset ${{ matrix.preset }} -j

      - name: Tests
        if: matrix.preset != 'release'
        run: ctest --preset ${{ matrix.preset }}
